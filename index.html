<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14151a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Foto App">
<title>Foto App</title>
<style>
  :root {
    --bg: #14151a; --panel: #1c1e25; --panel2: #252831; --border: #333745;
    --text: #e8e9ee; --muted: #9a9fb0; --accent: #e0a458; --danger: #d4574c;
    --ok: #5aa879; --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; }
  body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
  button { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  header.top {
    position: sticky; top: 0; z-index: 20; background: var(--bg);
    border-bottom: 1px solid var(--border); padding: 10px 16px 0;
  }
  .top-row { display: flex; align-items: center; gap: 10px; min-height: 40px; }
  .top-row h1 { font-size: 18px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tabs { display: flex; gap: 4px; margin-top: 6px; }
  .tab { flex: 1; padding: 12px 8px; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); font-weight: 600; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  main { padding: 16px; max-width: 1100px; margin: 0 auto; }
  .btn {
    background: var(--panel2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 16px; min-height: 46px; cursor: pointer; font-weight: 600;
  }
  .btn.primary { background: var(--accent); color: #1a1408; border-color: var(--accent); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn.small { min-height: 38px; padding: 8px 12px; font-size: 14px; }
  .btn:disabled { opacity: .4; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 8px; font-size: 18px; }
  .muted { color: var(--muted); font-size: 14px; }
  input[type=text], select {
    width: 100%; padding: 12px; font-size: 16px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
  }
  label.lbl { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  ol.steps { padding-left: 20px; line-height: 1.55; }
  code { background: var(--bg); padding: 2px 5px; border-radius: 4px; font-size: 13px; word-break: break-all; }

  .summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .pill { background: var(--panel2); border: 1px solid var(--border); border-radius: 99px; padding: 6px 12px; font-size: 14px; }
  .pill b { color: var(--accent); }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: flex; align-items: center; gap: 10px; text-align: left; width: 100%;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; min-height: 54px; cursor: pointer;
  }
  .row .name { flex: 1; word-break: break-word; }
  .row .count { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .row.empty { border-style: dashed; border-color: #6b5a3a; background: #1a1a1a; }
  .row.empty .name { color: #8a7a5a; }
  .row.empty .count { color: #a08a55; }
  .opt { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); margin-bottom: 10px; }
  .opt input { width: 20px; height: 20px; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .toolbar select { width: auto; flex: 1; min-width: 120px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { padding: 8px 12px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--border); font-size: 14px; cursor: pointer; }
  .chip.active { background: var(--accent); color: #1a1408; border-color: var(--accent); font-weight: 600; }

  .yearchips { display: flex; flex-wrap: wrap; gap: 8px; }
  .yearchip { min-width: 78px; min-height: 46px; padding: 0 14px; font-size: 18px; font-weight: 700; color: var(--text); background: var(--bg); border: 1px solid var(--line, #2c3345); border-radius: 12px; cursor: pointer; }
  .yearchip:active { background: var(--accent, #e8a74a); color: #111; }
  :root { --th: 130px; }
  .grid { display: flex; flex-wrap: wrap; gap: 3px; }
  .grid::after { content: ""; flex-grow: 1000; }
  .tile { position: relative; height: var(--th); background: var(--panel); border-radius: 6px; overflow: hidden; cursor: pointer; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile.weg img { opacity: .35; }
  .tile.weg { outline: 3px solid var(--danger); outline-offset: -3px; }
  .tile.houd { outline: 3px solid var(--ok); outline-offset: -3px; }
  .tile.mv { outline: 3px solid #5b8def; outline-offset: -3px; }
  .tile.mv .badge { background: #5b8def; max-width: 85%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mergebar { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .mergebar .txt { flex: 1 1 200px; font-size: 14px; color: var(--muted); }
  .mergebar .txt b { color: #8fb0ff; }
  .pick-row { cursor: pointer; }
  .tile .badge {
    position: absolute; left: 6px; top: 6px; font-size: 13px; font-weight: 700; padding: 2px 7px;
    border-radius: 99px; background: rgba(0,0,0,.65);
  }
  .tile.weg .badge { background: var(--danger); }
  .tile.houd .badge { background: var(--ok); }
  .tile .favflag { position: absolute; right: 6px; bottom: 4px; font-size: 16px; color: #ff6b81; text-shadow: 0 0 4px #000; }
  .tile .dmflag { position: absolute; left: 4px; bottom: 4px; font-size: 11px; padding: 1px 6px; border-radius: 99px; background: rgba(0,0,0,.72); color: #ffd27a; }
  .tile .check {
    position: absolute; right: 6px; top: 6px; width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid #fff; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; font-weight: 700;
  }
  .selecting .tile .check { display: flex; }
  .tile.selected .check { background: var(--accent); border-color: var(--accent); color: #1a1408; }
  .tile.selected { outline: 3px solid var(--accent); outline-offset: -3px; }

  .bulkbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--panel);
    border-top: 1px solid var(--border); padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .bulkbar .info { flex: 1 1 100%; font-size: 14px; color: var(--muted); }
  .bulkbar .btn { flex: 1; }
  .spacer { height: 130px; }

  /* Viewer */
  #viewer { position: fixed; inset: 0; z-index: 50; background: #000; display: flex; flex-direction: column; touch-action: pan-y; }
  #viewer .vtop { display: flex; align-items: center; gap: 10px; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); background: rgba(0,0,0,.6); }
  #viewer .vtitle { flex: 1; min-width: 0; font-size: 14px; }
  #viewer .vtitle div:last-child { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #viewer .vimg { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  #viewer .vimg img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #viewer .vimg.weg img { opacity: .45; }
  #viewer .vstate { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); padding: 4px 14px; border-radius: 99px; font-weight: 700; }
  #viewer .vstate.weg { background: var(--danger); } #viewer .vstate.houd { background: var(--ok); }
  #viewer .vnav { position: absolute; top: 0; bottom: 0; width: 22%; background: none; border: 0; color: #fff; font-size: 34px; opacity: .55; }
  #viewer .vnav.l { left: 0; text-align: left; padding-left: 10px; } #viewer .vnav.r { right: 0; text-align: right; padding-right: 10px; }
  #viewer .showonly { display: none; gap: 8px; } #viewer.show .showonly { display: inline-flex; }
  #castbar { position: fixed; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); z-index: 70; background: #1c2230; border: 1px solid #3a4560; border-radius: 16px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  #castbar.hidden { display: none; }
  #castbar .ctitle { flex: 1 1 100%; font-size: 14px; color: #c9d1e3; }
  #castbar .btn { min-width: 40px; padding: 6px 9px; font-size: 14px; }
  #castbar .ctitle { cursor: pointer; display: flex; align-items: center; gap: 6px; }
  #castbar .ctitle .cmin { margin-left: auto; opacity: .7; padding: 0 4px; }
  #castbar.min { padding: 6px 10px; }
  #viewer .favon { color: #ff6b81; }
  #viewer.show .vimg img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; object-fit: contain; transition: opacity 1.4s ease-in-out; }
  #viewer.show.fitcover .vimg img { object-fit: cover; }
  #viewer .vimg { overflow: hidden; }
  #viewer .vimg img { touch-action: none; transform-origin: 0 0; will-change: transform; }
  #viewer.zoomed .vnav { display: none; }
  #viewer.show .vtop, #viewer.show .vbar, #viewer.show .vnav { display: none; }
  #viewer.show.pauzed .vtop { display: flex; }
  #viewer .vimg img { transition: opacity .4s; }
  #viewer .vbar { display: flex; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: rgba(0,0,0,.75); }
  #viewer .vbar .btn { flex: 1; min-height: 56px; font-size: 17px; }

  #toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 100;
    background: #000; color: #fff; padding: 10px 16px; border-radius: 99px; font-size: 14px; max-width: 90vw;
    border: 1px solid var(--border);
  }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--panel); width: 100%; max-width: 560px; max-height: 80vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 0 0 10px; }
  .loading { text-align: center; color: var(--muted); padding: 30px 0; }
.castico{vertical-align:-3px}
.loadbar { position: sticky; top: 0; z-index: 5; margin: 0 0 8px; padding: 6px 12px; font-size: 13px; color: #c9d1e3; background: #1c2230; border: 1px solid #2f3850; border-radius: 99px; text-align: center; animation: pulse 1.4s ease-in-out infinite; }
.skel-note { color: #9aa3b5; font-size: 14px; margin: 4px 4px 10px; }
.skel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--th, 200px), 1fr)); gap: 6px; }
.skel { aspect-ratio: 1; border-radius: 8px; background: linear-gradient(100deg, #1a2030 30%, #262f45 50%, #1a2030 70%); background-size: 300% 100%; animation: shimmer 1.3s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@keyframes pulse { 50% { opacity: .65; } }
.brandline { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #e8ecf5; font-weight: 500; letter-spacing: .01em; }
.brandline img { border-radius: 6px; }
.sheet.info { max-width: 640px; max-height: 88vh; overflow: hidden; display: flex; flex-direction: column; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
.info-head, .info-tabs, .info-foot { flex: 0 0 auto; }
.info-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.info-tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.info-tabs .tab { flex: 0 0 auto; padding: 8px 9px; font-size: 13.5px; }
.info-body { overflow-y: auto; flex: 1 1 auto; min-height: 0; font-size: 14.5px; line-height: 1.5; padding-right: 4px; }
.info-body h4 { margin: 16px 0 4px; font-size: 15px; color: #e9b866; }
.info-body ul, .info-body ol { padding-left: 20px; margin: 4px 0; }
.info-body li { margin: 5px 0; }
.info-body code { background: #252831; padding: 1px 5px; border-radius: 5px; font-size: 12.5px; word-break: break-all; }
.info-foot { display: flex; align-items: center; gap: 10px; justify-content: center; padding-top: 10px; margin-top: 8px; border-top: 1px solid var(--border); font-size: 12px; color: #8b93a7; }
.info-foot .brandline span { display: none; }
</style>
</head>
<body>

<!-- ===== Instellen / inloggen ===== -->
<main id="view-setup" class="hidden">
  <div class="card">
    <img src="icon-192.png" alt="" width="72" height="72" style="border-radius:16px;display:block;margin:0 auto 10px"><h1 style="margin:0 0 8px;font-size:22px">Foto App</h1>
    <p class="muted">Eenmalig instellen: plak hieronder het <b>Client-ID</b> van je Google "Webtoepassing"
      (zie de instructies die erbij zaten). Dit blijft alleen op dit apparaat bewaard.</p>
    <label class="lbl" for="client-id">Client-ID</label>
    <input type="text" id="client-id" placeholder="123456-abc.apps.googleusercontent.com" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div style="margin-top:14px"><button class="btn primary" id="btn-save-client" style="width:100%">Opslaan</button></div>
  </div>
</main>

<main id="view-login" class="hidden">
  <div class="card" style="text-align:center">
    <img src="icon-192.png" alt="" width="72" height="72" style="border-radius:16px;display:block;margin:0 auto 10px"><h1 style="margin:0 0 8px;font-size:22px">Foto App</h1>
    <p class="muted">Log in met het Google-account waar je foto's in Drive staan.</p>
    <button class="btn primary" id="btn-login" style="width:100%">Inloggen met Google</button>
    <p class="muted" id="login-msg"></p>
    <button class="btn small" id="btn-change-client" style="margin-top:8px">Ander Client-ID gebruiken</button>
    <p style="margin:14px 0 0"><a href="#" id="login-help" style="color:var(--muted,#9aa3b5)">Uitleg, disclaimer &amp; privacy</a></p>
    <div style="margin-top:14px"><a class="brandline" href="https://bruindav.github.io/DigidaveStore/" target="_blank" rel="noopener" style="justify-content:center"><img src="digidave-logo.png" alt="" width="28" height="28"><span>digidave</span></a></div>
  </div>
</main>

<!-- ===== App ===== -->
<div id="view-app" class="hidden">
  <header class="top">
    <div class="top-row">
      <button class="btn small hidden" id="btn-back">←</button>
      <img src="favicon-32.png" alt="" width="28" height="28" style="border-radius:7px"><h1 id="title">Foto App</h1>
      <button class="btn small" id="btn-select">Selecteren</button>
      <button class="btn small" id="btn-help" title="Uitleg, disclaimer en privacy">?</button>
      <button class="btn small" id="btn-beheer" title="Beheer">⚙</button>
      <button class="btn small" id="btn-logout">Uit</button>
    </div>
    <div class="tabs">
      <button class="tab active" id="tab-look">👁 Kijken</button>
      <button class="tab hidden" id="tab-clean">🧹 Opschonen</button>
      <button class="tab" id="tab-albums">🖼 Albums</button>
    </div>
  </header>
  <main id="content"></main>
</div>

<div id="bulk" class="bulkbar hidden"></div>
<div id="viewer" class="hidden"></div>
<div id="sheet" class="hidden"></div>
<div id="castbar" class="hidden"></div>
<div id="toast" class="hidden"></div>

<script>
"use strict";
const API = "https://www.googleapis.com/drive/v3";
const SCOPE = "https://www.googleapis.com/auth/drive";
const FOLDER = "application/vnd.google-apps.folder";
const $ = (id) => document.getElementById(id);
// Client-ID is niet geheim; ingebouwd zodat je niets hoeft in te typen of in de link te zetten.
const DEFAULT_CLIENT_ID = "10444505530-oaftfitgok7urjcn5m18e7oe7md3q591.apps.googleusercontent.com";

// ------------------------------------------------------------------ opslag
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }

// ------------------------------------------------------------------ token
let token = null, tokenExp = 0, tokenClient = null, tokenWaiter = null;

function loadGis() {
  return new Promise((resolve, reject) => {
    if (window.google && google.accounts && google.accounts.oauth2) return resolve();
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("Kan Google-inlogscript niet laden (geen internet?)"));
    document.head.appendChild(s);
  });
}

async function initTokenClient() {
  await loadGis();
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: lsGet("fo_client_id"),
    scope: SCOPE,
    callback: (resp) => {
      const w = tokenWaiter; tokenWaiter = null;
      if (resp.error) { if (w) w.reject(new Error(resp.error_description || resp.error)); return; }
      token = resp.access_token;
      tokenExp = Date.now() + (parseInt(resp.expires_in || "3600", 10) - 60) * 1000;
      lsSet("fo_token", JSON.stringify({ token, tokenExp }));
      scheduleRefresh();
      if (typeof C !== "undefined" && C.active) castSend({ cmd: "token", token });
      if (!lsGet("fo_email")) rememberEmail();
      if (w) w.resolve();
    },
    error_callback: (err) => {
      const w = tokenWaiter; tokenWaiter = null;
      if (w) w.reject(new Error(err && err.type ? err.type : "inloggen mislukt"));
    },
  });
}

async function rememberEmail() {          // e-mailadres onthouden: Google hoeft dan niet meer te vragen welk account
  try {
    const r = await fetch(API + "/about?fields=user(emailAddress)", { headers: { Authorization: "Bearer " + token } });
    const j = await r.json(); if (j.user && j.user.emailAddress) lsSet("fo_email", j.user.emailAddress);
  } catch (e) {}
}
let refreshTimer = null;
function scheduleRefresh() {              // ruim voor het verlopen (na ~1 uur) stil een nieuw token halen
  clearTimeout(refreshTimer);
  const ms = Math.max(30000, tokenExp - Date.now() - 5 * 60 * 1000);
  refreshTimer = setTimeout(() => { requestToken(false).catch(() => {}); }, ms);
}
document.addEventListener("visibilitychange", () => {   // terug in de app na een tijd: meteen verversen als het token (bijna) verlopen is
  if (document.visibilityState === "visible" && tokenClient && token && tokenExp - Date.now() < 5 * 60 * 1000) requestToken(false).catch(() => {});
});

function requestToken(interactive) {
  return new Promise((resolve, reject) => {
    tokenWaiter = { resolve, reject };
    const opts = { prompt: interactive ? "" : "none" };
    const hint = lsGet("fo_email"); if (hint) opts.hint = hint;       // geen accountkeuze meer nodig
    if (!interactive) setTimeout(() => { if (tokenWaiter && tokenWaiter.resolve === resolve) { tokenWaiter = null; reject(new Error("geen reactie")); } }, 6000);
    try { tokenClient.requestAccessToken(opts); }
    catch (e) { tokenWaiter = null; reject(e); }
  });
}

async function refreshToken() {
  try { await requestToken(false); }
  catch (e) { showView("login"); $("login-msg").textContent = "Sessie verlopen: log opnieuw in."; throw e; }
}

// ------------------------------------------------------------------ Drive API
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function gapi(path, { method = "GET", params, body } = {}) {
  const url = new URL(API + path);
  if (params) for (const [k, v] of Object.entries(params)) if (v !== undefined && v !== null) url.searchParams.set(k, v);
  let refreshed = false;
  for (let attempt = 0; attempt < 5; attempt++) {
    const r = await fetch(url.toString(), {
      method,
      headers: Object.assign({ Authorization: "Bearer " + token }, body ? { "Content-Type": "application/json" } : {}),
      body: body ? JSON.stringify(body) : undefined,
    });
    if (r.status === 401 && !refreshed) { refreshed = true; await refreshToken(); continue; }
    if (r.status === 429 || r.status >= 500) { await sleep(400 * 2 ** attempt); continue; }
    if (!r.ok) throw new Error("Drive " + r.status + ": " + (await r.text()).slice(0, 200));
    return r.status === 204 ? null : r.json();
  }
  throw new Error("Drive reageert niet, probeer het zo opnieuw.");
}

async function listAll(q, fields, { orderBy, onPage, maxPages = 1000 } = {}) {
  let pageToken, out = [];
  for (let i = 0; i < maxPages; i++) {
    const res = await gapi("/files", { params: { q, fields: `nextPageToken, files(${fields})`, pageSize: 1000, pageToken, orderBy } });
    out = out.concat(res.files || []);
    if (onPage) onPage(out);
    pageToken = res.nextPageToken;
    if (!pageToken) break;
  }
  return out;
}

const qEsc = (s) => s.replace(/\\/g, "\\\\").replace(/'/g, "\\'");

// ------------------------------------------------------------------ hulpjes
let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.remove("hidden");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hidden"), 3500);
}
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function showView(v) {
  for (const id of ["setup", "login", "app"]) $("view-" + id).classList.toggle("hidden", id !== v);
}
function cleanName(n) { return (n || "").replace(/^\d+_/, "").replace(/\.jpg$/i, ""); }
function thumbUrl(f, size) {

const blobCache = new Map();
async function loadBlobInto(img, fileId) {
  try {
    if (!blobCache.has(fileId)) {
      const r = await fetch(`${API}/files/${fileId}?alt=media`, { headers: { Authorization: "Bearer " + token } });
      if (!r.ok) return;
      blobCache.set(fileId, URL.createObjectURL(await r.blob()));

}
async function lensSearch(f) {      // "Wat is dit?": foto delen met Google Lens / de Google-app (Lens kan je Drive-link zelf niet openen)
  if (!f) return;
  try {
    toast("Foto voorbereiden…");
    const r = await fetch(`${API}/files/${f.id}?alt=media`, { headers: { Authorization: "Bearer " + token } });
    if (!r.ok) throw new Error("ophalen mislukt (" + r.status + ")");
    const file = new File([await r.blob()], "foto.jpg", { type: "image/jpeg" });
    // Google accepteert geen foto's meer rechtstreeks vanaf een andere website (403): bewaar de foto op de telefoon
    // en open Lens; daar kies je met "Foto uploaden" de zojuist bewaarde foto.
    const url = URL.createObjectURL(file);
    const a = document.createElement("a"); a.href = url; a.download = "wat-is-dit.jpg"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast("Foto bewaard. In Lens: kies 'Foto uploaden' en tik op de zojuist bewaarde foto (wat-is-dit.jpg)");
    setTimeout(() => window.open("https://lens.google.com/", "_blank", "noopener"), 1200);
  } catch (e) { if (e && e.name !== "AbortError") toast("Zoeken mislukt: " + (e.message || e)); }
}
function setImg(img, f, size) {
  let triedBlob = false;
  img.onerror = () => { if (!triedBlob) { triedBlob = true; loadBlobInto(img, f.id); } };
  const u = thumbUrl(f, size);
  if (u) img.src = u; else { triedBlob = true; loadBlobInto(img, f.id); }
}

// ------------------------------------------------------------------ terug-knop (geschiedenis)
// Elk "scherm erbovenop" (lijst, grote foto, keuzemenu, selecteermodus) krijgt een
// geschiedenisregel; de terug-knop van de telefoon sluit dan dat scherm i.p.v. de app.
let navStack = [], pendingFn = null, lastExit = 0, histReady = false;
const navTop = () => navStack[navStack.length - 1];
function pushNav(kind) { navStack.push(kind); try { history.pushState({ k: kind }, ""); } catch (e) {} }
function goBack() { try { history.back(); } catch (e) {} }
function unwindThen(fn) {            // alle schermen erbovenop weg, dan fn()
  if (!navStack.length) return fn();
  const n = navStack.length; navStack = []; pendingFn = fn;
  hideViewer(true); hideSheet(); history.go(-n);
}
function initHistory() {
  if (histReady) return; histReady = true;
  try { history.replaceState({ k: "base" }, ""); history.pushState({ k: "home" }, ""); } catch (e) {}
}
window.addEventListener("popstate", () => {
  if (pendingFn) { const f = pendingFn; pendingFn = null; f(); return; }
  if (!navStack.length) {            // terug op het beginscherm: eerst waarschuwen, 2e keer sluit de app
    if ($("view-app").classList.contains("hidden")) return;
    if (Date.now() - lastExit < 2500) { goBack(); return; }
    lastExit = Date.now(); toast("Druk nogmaals op terug om te sluiten");
    try { history.pushState({ k: "home" }, ""); } catch (e) {}
    return;
  }
  const kind = navStack.pop();
  if (kind === "viewer") hideViewer();
  else if (kind === "sheet") hideSheet();
  else if (kind === "select") { exitSelect(); if (S.items.length) renderItems(); }
  else if (kind === "yearfolder") { exitSelect(); S.yearFolder = null; renderItems(); }
  else if (kind === "list") { exitSelect(); S.tab === "albums" ? renderAlbumsHome() : renderCleanHome(); }
});

async function findPreviewRoot() {
  if (S.previewRoot) return S.previewRoot;
  const res = await listAll(`mimeType='${FOLDER}' and trashed=false and properties has { key='fa_root' and value='previews' }`, "id,name");
  if (!res.length) throw new Error('Map "Foto Archief Voorbeelden" niet gevonden in Drive. Draai eerst sync_previews.py op je laptop.');
  S.previewRoot = res[0].id; return S.previewRoot;
}

async function loadYears() {            // alleen jaren waarvoor foto's bestaan (bewaard tot de volgende sync)
  try { const st = JSON.parse(lsGet("fo_years") || "null"); if (st && st.root === S.previewRoot && st.sync === (S.previewSync || "")) { S.years = st.years; return; } } catch (e) {}
  const now = new Date().getFullYear(), cand = [];
  for (let y = now; y >= 1950; y--) cand.push(y);
  const has = {};
  for (let i = 0; i < cand.length; i += 10) {
    await Promise.all(cand.slice(i, i + 10).map(async (y) => {
      const r = await gapi("/files", { params: { q: `properties has { key='fa' and value='1' } and properties has { key='yr' and value='${y}' } and trashed=false`, fields: "files(id)", pageSize: 1 } });
      has[y] = (r.files || []).length > 0;
    }));
  }
  S.years = cand.filter((y) => has[y]);
  lsSet("fo_years", JSON.stringify({ root: S.previewRoot, sync: S.previewSync || "", years: S.years }));
}
const HIDDEN_FOLDER = /(^|\/ )(__pycache__|drive[ _]sync|\.git|node_modules|\.thumbcache|_te_verwijderen)( \/|$)/i;   // technische mappen tonen we niet

    if (!cached) {

      <div class="yearchips" id="year-chips"><span class="muted">Jaren laden…</span></div></div>

  const fillYears = () => {

  $("hide-empty").checked = lsGet("fo_hide_empty") !== "0";   // standaard lege (bovenliggende) mappen verbergen

    S.folders.filter((f) => f.name.toLowerCase().includes(q) && !HIDDEN_FOLDER.test(f.name)).forEach((f) => {

  S.counts = null; draw();
  // aantal foto's per map ophalen (op de achtergrond), zodat lege mappen een andere kleur krijgen

      onPage: (items) => { S.countProgress = items.length; const st = $("count-status"); if (st) st.textContent = `(tellen… ${items.length})`; },
    }).then((items) => {

const PHOTO_FIELDS = "id,name,thumbnailLink,parents,properties,imageMediaMetadata(width,height)";

async function openFolder(f) {
  S.view = "folder"; S.current = { id: f.id, name: f.name }; S.filter = "all";
  await loadItems(`'${f.id}' in parents and trashed=false`, f.name, "name");

async function openYear(y) {

  await loadItems(`properties has { key='fa' and value='1' } and properties has { key='yr' and value='${y}' } and trashed=false`, "Jaar " + y, "name");

const itemCache = new Map();          // laatst geopende mappen: bij terugkeren direct tonen, op de achtergrond verversen
let loadSeq = 0;
function skeletonHtml() {
  return '<div class="skel-note">Foto\'s laden…</div><div class="skel-grid">' + '<div class="skel"></div>'.repeat(18) + '</div>';
}
function showLoadBar(n, done) {
  let bar = $("loadbar");
  if (done) { if (bar) bar.remove(); return; }
  if (!bar) { bar = document.createElement("div"); bar.id = "loadbar"; bar.className = "loadbar"; const c = $("content"); c.insertBefore(bar, c.firstChild); }
  bar.textContent = `⏳ Meer foto's laden… ${n} tot nu toe`;
}
async function loadItems(q, title, orderBy) {
  if (navTop() !== "list" && navTop() !== "yearfolder") pushNav("list");
  setHeader(title, true);
  exitSelect();
  const c = $("content"), my = ++loadSeq, view = S.view, cur = S.current, key = q + "|" + orderBy;
  const cached = itemCache.get(key);
  const alive = () => my === loadSeq && S.view === view && S.current === cur;
  let shown = false;
  if (cached) { S.items = cached; renderItems(); shown = true; showLoadBar(cached.length); }
  else c.innerHTML = skeletonHtml();
  const keepScroll = (fn) => { const y = window.scrollY; fn(); window.scrollTo(0, y); };
  try {
    const items = await listAll(q, PHOTO_FIELDS, { orderBy, onPage: (part) => {
      if (!alive() || cached) return;                       // met cache wachten we met verversen tot alles binnen is
      S.items = part;                                       // eerste pagina meteen tonen; de rest komt er vanzelf bij
      keepScroll(() => renderItems()); shown = true; showLoadBar(part.length);
    } });
    if (!alive()) { itemCache.set(key, items); return; }
    itemCache.set(key, items);
    if (itemCache.size > 8) itemCache.delete(itemCache.keys().next().value);
    S.items = items;
    keepScroll(() => renderItems());
    showLoadBar(0, true);
  } catch (e) { if (alive() && !shown) c.innerHTML = `<div class="card"><p class="muted">${esc(e.message)}</p></div>`; else showLoadBar(0, true); }
}

function counts() {
  let weg = 0, houd = 0, move = 0;
  S.items.forEach((f) => {
    const m = mark(f); if (m === "weg") weg++; else if (m === "houd") houd++;
    if (f.properties && f.properties.mv) move++;

  return { weg, houd, move, open: S.items.filter((f) => !mark(f) && !(f.properties && f.properties.mv)).length };
}
function visibleItems() {
  return S.items.filter((f) => {
    if (S.view === "year" && S.yearFolder && S.yearFolder !== "*" && ((f.parents || [])[0] || "?") !== S.yearFolder) return false;
    const m = mark(f), mv = f.properties && f.properties.mv;
    return S.filter === "all" || (S.filter === "fav" && isFav(f)) || (S.filter === "open" && !m && !mv) || S.filter === m || (S.filter === "move" && mv);
  });
}

function castKey() { return [S.view, S.current && (S.current.id || S.current.year), S.yearFolder || ""].join("|"); }
function maybeFollowCast() {        // tv volgt automatisch de map/het album dat je opent (aan/uit via de castbalk)
  if (typeof C === "undefined" || !C.active || !C.follow || !C.session) return;
  if (S.view === "year" && !S.yearFolder) return;

function dateMismatch(f) {      // opnamedatum (EXIF-jaar) wijkt af van het jaar van de map
  const pr = f.properties || {};
  return pr.ey && pr.yr && pr.ey !== pr.yr ? { ey: pr.ey, yr: pr.yr } : null;
}
function makeTile(f, idx) {
  const w = f.imageMediaMetadata && f.imageMediaMetadata.width, h = f.imageMediaMetadata && f.imageMediaMetadata.height;
  const ratio = w && h ? w / h : 1.33;
  const t = document.createElement("div");

  t.style.flexGrow = String(Math.round(ratio * 100));
  t.style.flexBasis = Math.round(ratio * S.tileH) + "px";

// ------------------------------------------------------------------ markeren
async function setProps(files, patch) {
  // patch: {sleutel: waarde | null}. Optimistisch bijwerken, daarna naar Drive; bij fout terugdraaien.
  const prev = files.map((f) => [f, Object.assign({}, f.properties)]);
  files.forEach((f) => {
    f.properties = Object.assign({}, f.properties);
    for (const [k, v] of Object.entries(patch)) { if (v === null) delete f.properties[k]; else f.properties[k] = v; }
  });
  let failed = 0, idx = 0;
  const worker = async () => {
    while (idx < files.length) {
      const f = files[idx++];
      try {
        await gapi("/files/" + f.id, { method: "PATCH", params: { fields: "id" }, body: { properties: patch } });
      } catch (e) {
        failed++;
        f.properties = prev.find((p) => p[0] === f)[1];
      }
    }
  };
  await Promise.all(Array.from({ length: Math.min(5, files.length) }, worker));
  if (failed) toast(`${failed} wijziging(en) mislukt`);
  return failed;
}

async function setMarks(files, value) {
  // value: "weg" | "houd" | "" (alles wissen). Weg of wissen haalt ook een verplaats-verzoek weg.
  const patch = { mark: value || null };
  if (value !== "houd") { patch.mv = null; patch.mvf = null; }
  return setProps(files, patch);
}

function setMove(files, folder) {
  return setProps(files, { mv: folder.id, mvf: "1", mark: null });
}

// ---- diavoorstelling (ook handig om de telefoon naar een tv/Chromecast te casten)
let showTimer = null, showPaused = false, wakeLock = null, vOrig = null;
const showCfg = { fit: lsGet("fo_show_fit") === "cover" ? "cover" : "contain", sec: [3, 6, 10, 20].includes(Number(lsGet("fo_show_sec"))) ? Number(lsGet("fo_show_sec")) : 6, shuffle: lsGet("fo_show_shuf") === "1" };
function shuffled(arr, firstId) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  if (firstId) { const k = a.findIndex((x) => x.id === firstId); if (k > 0) [a[0], a[k]] = [a[k], a[0]]; }
  return a;
}
function applyShuffle() {                 // volgorde aanpassen terwijl de voorstelling loopt
  if (!(showTimer || showPaused) || !vList.length) return;
  const cur = vList[vIndex];
  if (showCfg.shuffle) { if (!vOrig) vOrig = vList.slice(); vList = shuffled(vOrig, cur && cur.id); vIndex = 0; }
  else if (vOrig) { vList = vOrig; vOrig = null; vIndex = Math.max(0, vList.findIndex((x) => cur && x.id === cur.id)); }
  renderViewer();
}

  await new Promise((res) => { nu.onload = res; nu.onerror = res; setImg(nu, f, 1920); setTimeout(res, 8000); });
  if (!showTimer || $("v-photo") !== old) return;              // voorstelling intussen gepauzeerd of gestopt
  vIndex = n;
  box.insertBefore(nu, box.querySelector(".vnav"));
  void nu.offsetWidth; nu.style.opacity = "1";
  old.id = ""; nu.id = "v-photo";
  setTimeout(() => old.remove(), 1600);
  const nx = vList[(n + 1) % vList.length]; if (nx && nx.thumbnailLink) new Image().src = thumbUrl(nx, 1920);   // volgende alvast ophalen
}

// ---- zoomen: knijpen, slepen, dubbeltikken (en scrollwiel op de laptop)
let Z = { s: 1, x: 0, y: 0, hi: false };
function initZoom() {
  const box = $("v-img"), img = $("v-photo"); if (!box || !img) return;
  Z = { s: 1, x: 0, y: 0, hi: false };
  $("viewer").classList.remove("zoomed");
  const pts = new Map(); let pinch0 = null, drag0 = null, lastTap = { t: 0, x: 0, y: 0 }, base = null, moved = false;
  const measure = () => { const r = img.getBoundingClientRect(); base = { l: r.left - Z.x, t: r.top - Z.y, w: r.width / Z.s, h: r.height / Z.s }; };
  const clamp = () => {
    const B = box.getBoundingClientRect(), W = base.w * Z.s, H = base.h * Z.s;
    const minX = W >= B.width ? B.right - base.l - W : (B.left + B.width / 2) - base.l - W / 2, maxX = W >= B.width ? B.left - base.l : minX;
    const minY = H >= B.height ? B.bottom - base.t - H : (B.top + B.height / 2) - base.t - H / 2, maxY = H >= B.height ? B.top - base.t : minY;
    Z.x = Math.min(maxX, Math.max(minX, Z.x)); Z.y = Math.min(maxY, Math.max(minY, Z.y));
  };
  const apply = () => {
    if (Z.s <= 1.01) { Z.s = 1; Z.x = 0; Z.y = 0; } else clamp();
    img.style.transform = Z.s === 1 ? "" : `translate(${Z.x}px,${Z.y}px) scale(${Z.s})`;
    $("viewer").classList.toggle("zoomed", Z.s > 1.01);
    if (Z.s > 1.2 && !Z.hi) { Z.hi = true; const f = vList[vIndex]; if (f) setImg(img, f, 2400); }   // scherpere versie zodra je inzoomt
  };
  const zoomAt = (px, py, s2) => {
    if (!base || Z.s === 1) measure();
    s2 = Math.min(6, Math.max(1, s2));
    const ux = (px - base.l - Z.x) / Z.s, uy = (py - base.t - Z.y) / Z.s;
    Z.x = px - base.l - ux * s2; Z.y = py - base.t - uy * s2; Z.s = s2; apply();
  };
  const ok = (e) => e.target === img || e.target === box;
  box.addEventListener("pointerdown", (e) => {
    if (!ok(e) || $("viewer").classList.contains("show")) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = false;
    try { box.setPointerCapture(e.pointerId); } catch (_) {}
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = { d: Math.hypot(a.x - b.x, a.y - b.y), s: Z.s }; drag0 = null; }
    else if (pts.size === 1) { if (Z.s === 1) measure(); drag0 = { x: e.clientX, y: e.clientY, ox: Z.x, oy: Z.y }; }
  });
  box.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && pinch0) {
      const [a, b] = [...pts.values()]; moved = true;
      zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinch0.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch0.d);
    } else if (pts.size === 1 && drag0 && Z.s > 1) {
      if (Math.abs(e.clientX - drag0.x) + Math.abs(e.clientY - drag0.y) > 4) moved = true;
      Z.x = drag0.ox + e.clientX - drag0.x; Z.y = drag0.oy + e.clientY - drag0.y; apply();
    }
  });
  const up = (e) => {

      <li><b>"Database bezet"</b>: een ander programma gebruikt photos.db. Sluit het of wacht even; synchronisaties proberen het vanzelf opnieuw.</li>
      <li><b>Inlogfout bij Drive</b> (invalid_grant): de Google-inlog is verlopen. Het logboek vertelt welk bestand je moet verwijderen (<code>.fotoarchief\\token.json</code> in je gebruikersmap) en daarna log je opnieuw in.</li>
      <li>Maak af en toe een kopie van <code>photos.db</code> als back-up (bewaar die niet in een gedeelde map).</li>
    </ul>`],
  disclaimer: ["Disclaimer", `
    <h4>Disclaimer</h4>
    <p>De Foto App is een persoonlijk hobbyproject van digidave en wordt aangeboden <b>zoals het is</b>, zonder enige garantie op juistheid, beschikbaarheid of geschiktheid voor een bepaald doel. Gebruik is voor eigen risico.</p>
    <ul>
      <li><b>Back-ups:</b> deze app is geen back-up. Zorg dat je foto's elders veilig bewaard zijn. Hoewel opruimacties pas na jouw bevestiging op de laptop worden uitgevoerd en verwijderde foto's eerst naar een map <code>_te_verwijderen</code> gaan, kan de maker niet aansprakelijk worden gesteld voor verlies of beschadiging van foto's of gegevens.</li>
      <li><b>Toegang tot Google Drive:</b> de app vraagt toegang tot je Google Drive om voorbeelden te lezen en eigenschappen en mappen aan te passen. Gebruik daarvoor bij voorkeur je eigen account. Je kunt de toegang altijd intrekken via je Google-account (Beveiliging &rarr; Apps met toegang tot je account).</li>
      <li><b>Gezichtsherkenning</b> werkt met een rekenmethode en maakt fouten: personen kunnen verkeerd, of niet worden herkend. Controleer altijd de resultaten voordat je ze deelt.</li>
      <li><b>Diensten van derden</b> (Google Drive, Google Cast/Chromecast, Google Lens, GitHub Pages) vallen onder hun eigen voorwaarden en kunnen zonder bericht veranderen of stoppen. Deze app is niet gelieerd aan of goedgekeurd door Google. Google, Drive, Chromecast en Lens zijn merken van Google LLC.</li>
      <li>De app kan worden gewijzigd of stopgezet zonder voorafgaande kennisgeving.</li>
    </ul>
    <p>Vragen of opmerkingen? Je vindt de maker via het overzicht van digidave.</p>`],
  privacy: ["Privacy", `
    <h4>Privacyverklaring</h4>
    <p>Kort gezegd: <b>je foto's blijven van jou</b>. De maker heeft geen server en ziet je foto's, gegevens of inlog niet.</p>
    <h4>Hoe werkt het technisch?</h4>
    <ul>
      <li>Deze pagina is een statische webpagina op GitHub Pages. De code draait in <b>je eigen browser</b> en praat rechtstreeks met <b>jouw Google Drive</b>, met je eigen Google-inlog. Er is geen database of server van de maker waar je gegevens heen gaan.</li>
      <li>De pagina bewaart in je browser alleen voorkeuren (zoals tegelgrootte en diavoorstelling), tellingen van mappen, je e-mailadres als inlogtip en een kortdurende toegangscode van Google (die na ongeveer een uur verloopt). Dat is lokaal en verdwijnt als je de sitegegevens van je browser wist.</li>
      <li>Je foto's (kleine voorbeelden) staan in jouw Drive-map "Foto Archief Voorbeelden"; albums in "Foto Archief Albums". Markeringen (weg/houden, ♥, verplaatsen) worden als eigenschap bij het bestand in jouw Drive bewaard.</li>
    </ul>
    <h4>Welke toegang vraagt de app?</h4>
    <p>Toegang tot je Google Drive (om voorbeelden te lezen en mappen, albums en eigenschappen aan te passen). Je kunt dit altijd intrekken in je Google-account.</p>
    <h4>Casten naar de tv</h4>
    <p>Voor casten laadt de tv een ontvangerpagina van deze app (GitHub Pages). Telefoon en tv krijgen de lijst met foto-links en een kortdurende toegangscode om de voorbeelden uit jouw Drive te tonen. Dit gebeurt via de Google Cast-dienst; zie het privacybeleid van Google.</p>
    <h4>Google Lens (🔍)</h4>
    <p>De foto wordt op je telefoon bewaard; daarna upload je hem zelf in Google Lens. Voor die verwerking geldt het privacybeleid van Google.</p>
    <h4>De laptop-app</h4>
    <ul>
      <li>Je originele foto's, de database, tags, albums en <b>gezichtsgegevens</b> (numerieke kenmerken van gezichten en de namen die jij koppelt) blijven <b>uitsluitend op je eigen laptop</b>. Ze gaan niet naar Drive, GitHub of deze webapp.</li>
      <li>De foto-app op de laptop is alleen bereikbaar via dit apparaat (127.0.0.1) en weigert verzoeken van andere websites.</li>
      <li>Gezichtsgegevens zijn persoonsgegevens, ook van anderen. Gebruik ze alleen voor persoonlijk of huishoudelijk gebruik, deel <code>photos.db</code> niet met anderen, en bewaar hem niet in een gedeelde of gesynchroniseerde map. Een persoon en zijn gezichtsgegevens verwijder je in <b>👤 Personen</b> met het kruisje.</li>
    </ul>
    <h4>Je rechten en vragen</h4>
    <p>Wil je alles wissen? Wis de sitegegevens van deze pagina in je browser, trek de toegang in via je Google-account, en verwijder de mappen "Foto Archief Voorbeelden" en "Foto Archief Albums" uit je Drive. Vragen? Neem contact op via het overzicht van digidave.</p>`],
};
function openInfo(tab) {
  const sh = $("sheet");
  if (navTop() !== "sheet") pushNav("sheet");
  sh.className = "sheet-bg";
  const keys = Object.keys(INFO);
  tab = INFO[tab] ? tab : "uitleg";
  sh.innerHTML = `<div class="sheet info">
    <div class="info-head">${brandHtml}<button class="btn small" id="info-close">✕</button></div>
    <div class="info-tabs">${keys.map((k) => `<button class="tab ${k === tab ? "active" : ""}" data-k="${k}">${INFO[k][0]}</button>`).join("")}</div>
    <div class="info-body">${INFO[tab][1]}</div>
    <div class="info-foot">${brandHtml}<span>Foto App &middot; een project van digidave</span></div></div>`;
  $("info-close").onclick = closeSheet;
  sh.onclick = (e) => { if (e.target === sh) closeSheet(); };
  sh.querySelectorAll(".info-tabs .tab").forEach((b) => { b.onclick = () => openInfo(b.dataset.k); });
  sh.querySelector(".info-body").scrollTop = 0;
}

$("tab-look").onclick = () => setTab("look");
$("btn-help").onclick = () => openInfo("uitleg");
$("btn-beheer").onclick = () => {
  const sh = $("sheet"); pushNav("sheet"); sh.className = "sheet-bg";
  sh.innerHTML = `<div class="sheet"><h3>Beheer</h3>
    <label class="opt" style="display:flex;gap:10px;align-items:center;margin:8px 0 14px"><input type="checkbox" id="adm-on" ${isAdmin() ? "checked" : ""}> <span>Opruimen tonen (foto's markeren als weg, verplaatsen, albums bewerken)</span></label>
    <button class="btn" id="sheet-cancel" style="width:100%">Sluiten</button></div>`;
  $("sheet-cancel").onclick = closeSheet;
  sh.onclick = (e) => { if (e.target === sh) closeSheet(); };
  $("adm-on").onchange = (e) => {
    lsSet("fo_admin", e.target.checked ? "1" : "0"); applyAdmin(); closeSheet();
    if (!e.target.checked && S.tab === "clean") setTab("look"); else if (S.tab === "albums") setTab("albums");
    else if (e.target.checked) toast("Opschonen staat nu naast Kijken. De app start altijd in de viewer.");
  };
};
$("tab-clean").onclick = () => setTab("clean");
$("tab-albums").onclick = () => setTab("albums");
$("btn-back").onclick = () => { if (navTop() === "list" || navTop() === "yearfolder") goBack(); else setTab(S.tab); };
$("btn-select").onclick = () => {
  if (S.selecting) { if (navTop() === "select") goBack(); else { exitSelect(); renderItems(); } return; }
  S.selecting = true; S.selected = new Set(); pushNav("select");
  $("btn-select").textContent = "Klaar";
  renderItems();
};
$("btn-logout").onclick = () => {
  try { if (token && window.google) google.accounts.oauth2.revoke(token, () => {}); } catch (e) {}
  token = null; lsSet("fo_token", null); showView("login");
};

// ------------------------------------------------------------------ start
$("btn-save-client").onclick = () => {
  const v = $("client-id").value.trim();
  if (!/\.apps\.googleusercontent\.com$/.test(v)) { toast("Dat lijkt geen geldig Client-ID (eindigt op .apps.googleusercontent.com)"); return; }
  lsSet("fo_client_id", v); start();
};
$("btn-change-client").onclick = () => { $("client-id").value = lsGet("fo_client_id") || ""; showView("setup"); };
$("login-help").onclick = (e) => { e.preventDefault(); openInfo("uitleg"); };
$("btn-login").onclick = async () => {
  $("login-msg").textContent = "";
  try { await initTokenClient(); await requestToken(true); enterApp(); }
  catch (e) { $("login-msg").textContent = "Inloggen mislukt: " + e.message; }
};

function enterApp() { showView("app"); initHistory(); applyAdmin(); setTabNow(lsGet("fo_tab") === "albums" ? "albums" : "look"); }   // altijd starten in de viewer

async function start() {
  // client-id via link: foto_opruimen.html#client=....apps.googleusercontent.com
  const m = location.hash.match(/client=([^&]+)/);
  if (m) { lsSet("fo_client_id", decodeURIComponent(m[1])); history.replaceState(null, "", location.pathname); }
  const mc = location.hash.match(/cast=([^&]+)/);
  if (mc) { lsSet("fo_cast_app_id", decodeURIComponent(mc[1])); history.replaceState(null, "", location.pathname); }
  if (!lsGet("fo_client_id") && DEFAULT_CLIENT_ID) lsSet("fo_client_id", DEFAULT_CLIENT_ID);
  if (!lsGet("fo_client_id")) return showView("setup");
  try {
    const saved = JSON.parse(lsGet("fo_token") || "null");
    if (saved && saved.tokenExp > Date.now() + 60000) {
      token = saved.token; tokenExp = saved.tokenExp;
      await initTokenClient();
      scheduleRefresh();
      return enterApp();
    }
    // token verlopen maar eerder ingelogd: probeer stil opnieuw (werkt als je nog bij Google ingelogd bent)
    if (saved && lsGet("fo_email")) {
      $("login-msg").textContent = "Opnieuw verbinden…"; showView("login");
      await initTokenClient();
      try { await requestToken(false); return enterApp(); } catch (e) { $("login-msg").textContent = ""; }
    }
  } catch (e) {}
  showView("login");
}
start();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
